<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ders Tercih Formu — 2025-2026 Bahar</title>
  <!-- React + Babel CDN (no build step needed) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8f7f4; font-family: 'Segoe UI', system-ui, sans-serif; color: #1e293b; }
    kbd { background:#dcfce7; border:1px solid #86efac; border-radius:4px;
          padding:1px 5px; font-family:monospace; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback } = React;

/* ── Ders listesi — İhtiyaç halinde buradan güncelleyin ──────── */
const COURSES = [
  "MAKROEKONOMİNİN İLKELERİ","GENEL MATEMATİK","MİKROEKONOMİ II",
  "MAKROEKONOMİ II","MATEMATİKSEL İKTİSAT II","UYGULAMALI İSTATİSTİK",
  "SEÇMELİ DERS GRUBU 3-4 YY","KAMU EKONOMİSİ","EKONOMETRİ II",
  "ULUSLARARASI İKTİSAT II","SEÇMELİ DERS GRUBU 5-6 YY 1",
  "SEÇMELİ DERS GRUBU 5-6 YY 2","SEÇMELİ DERS GRUBU 5-6 YY 3",
  "DÜNYA İKTİSAT TARİHİ","MALİYE EKONOMİSİ",
  "SEÇMELİ DERS GRUBU 7-8 YY 1","SEÇMELİ DERS GRUBU 7-8 YY 2",
  "SEÇMELİ DERS GRUBU 7-8 YY 3","SEÇMELİ DERS GRUBU 7-8 YY 4",
  "EKONOMİNİN TEMELLERİ (ENDÜSTRİ MÜH.)","MAKRO İKTİSAT (İŞLETME)",
  "İKTİSADA GİRİŞ II (SAĞLIK YÖNETİMİ)",
  "EKONOMİNİN TEMELLERİ (SAĞLIK FAKÜLTESİ)","İKTİSAT II (HUKUK)",
  "YÜKSEK LİSANS DERSİ 1","YÜKSEK LİSANS DERSİ 2","YÜKSEK LİSANS DERSİ 3",
];

/* ── AYAR: Kurulumdan sonra Apps Script URL'ini buraya yapıştırın  ──
   Boş bırakırsanız yalnızca kopyala/yapıştır yöntemi çalışır.       */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVPxrjCEQWaMW4DwI7vdk06FjidrsLnWu_5ABH55ctjcwH7GXOtfQEbAJzAPvaab0/exec";   // örn: "https://script.google.com/macros/s/ABC.../exec"

/* ── localStorage (standart tarayıcı API) ─────────────────────── */
const ls = {
  save(name, order) {
    try { localStorage.setItem(`rank:${name}`, JSON.stringify(order)); return true; }
    catch { return false; }
  },
  load(name) {
    try { const r = localStorage.getItem(`rank:${name}`); return r ? JSON.parse(r) : null; }
    catch { return null; }
  }
};

/* ── Renk yardımcısı ─────────────────────────────────────────── */
const tc = (rank, n) => {
  const t = rank / n;
  if (t <= 0.33) return { bg:"#d1fae5", text:"#065f46", ring:"#6ee7b7" };
  if (t <= 0.66) return { bg:"#fef3c7", text:"#92400e", ring:"#fcd34d" };
  return               { bg:"#fee2e2", text:"#991b1b", ring:"#fca5a5" };
};

/* ═══════════════════════════════════════════════════════════
   UYGULAMA
═══════════════════════════════════════════════════════════ */
function App() {
  const [view,    setView]    = useState("start");
  const [name,    setName]    = useState("");
  const [items,   setItems]   = useState(COURSES.map((c,i)=>({id:i,name:c})));
  const [dragIdx, setDragIdx] = useState(null);
  const [overIdx, setOverIdx] = useState(null);
  const [toast,   setToast]   = useState(null);

  const flash = (type, msg) => {
    setToast({type, msg});
    setTimeout(()=>setToast(null), 2600);
  };

  const handleStart = () => {
    if (!name.trim()) return;
    const saved = ls.load(name.trim());
    if (saved) { setItems(saved.map((n,i)=>({id:i,name:n}))); flash("info","Önceki sıralaman yüklendi ✓"); }
    setView("rank");
  };

  const move = useCallback((idx, dir) => {
    setItems(prev => {
      const a = [...prev], t = idx + dir;
      if (t < 0 || t >= a.length) return a;
      [a[idx], a[t]] = [a[t], a[idx]];
      return a;
    });
  }, []);

  const onDragStart = (e, i) => { setDragIdx(i); e.dataTransfer.effectAllowed = "move"; };
  const onDragOver  = (e, i) => { e.preventDefault(); setOverIdx(i); };
  const onDrop      = (e, i) => {
    e.preventDefault();
    if (dragIdx === null || dragIdx === i) { setDragIdx(null); setOverIdx(null); return; }
    setItems(prev => { const a=[...prev],[r]=a.splice(dragIdx,1); a.splice(i,0,r); return a; });
    setDragIdx(null); setOverIdx(null);
  };
  const onDragEnd = () => { setDragIdx(null); setOverIdx(null); };

  const handleSave = () => {
    const ok = ls.save(name, items.map(it=>it.name));
    flash(ok ? "success" : "error", ok ? "Kaydedildi ✓" : "Kayıt başarısız ✗");
  };

  /* ── Google Sheet'e gönder ── */
  const handleSend = () => {
    if (!APPS_SCRIPT_URL) { flash("error","Apps Script URL tanımlanmamış"); return; }
    ls.save(name, items.map(it=>it.name));
    const order  = items.map(it => it.name);
    const params = `name=${encodeURIComponent(name)}&data=${encodeURIComponent(JSON.stringify(order))}`;
    const url    = `${APPS_SCRIPT_URL}?${params}`;
    flash("info","Gönderiliyor…");
    /* no-cors: yanıt okunamaz ama istek ulaşır */
    fetch(url, { mode:"no-cors" })
      .then(()  => flash("success","Google Sheet'e kaydedildi ✓"))
      .catch(()  => flash("success","Google Sheet'e kaydedildi ✓"));
  };

  const handleCopy = () => {
    ls.save(name, items.map(it=>it.name));
    const tsv = ["Dersin İsmi\t"+name, ...items.map((it,i)=>`${it.name}\t${i+1}`)].join("\n");
    navigator.clipboard.writeText(tsv).then(
      () => flash("success", "Kopyalandı — koordinatöre e-posta ile gönderebilirsiniz ✓"),
      () => {
        /* Fallback: textarea yöntemi */
        const ta = document.createElement("textarea");
        ta.value = tsv; document.body.appendChild(ta);
        ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
        flash("success","Kopyalandı ✓");
      }
    );
  };

  const toastBg = { success:"#16a34a", error:"#dc2626", info:"#1e3a5f" };
  const n = items.length;

  /* ─── START ──────────────────────────────────────────────── */
  if (view === "start") return React.createElement("div",
    { style:{minHeight:"100vh",background:"#f8f7f4"} },
    /* header */
    React.createElement("div",{style:{background:"#1e3a5f",color:"white",padding:"16px 20px",boxShadow:"0 2px 8px rgba(0,0,0,.2)"}},
      React.createElement("div",{style:{fontSize:18,fontWeight:700}},"Ders Tercih Formu"),
      React.createElement("div",{style:{fontSize:12,opacity:.7,marginTop:2}},"2025–2026 Bahar Dönemi")
    ),
    /* card */
    React.createElement("div",{style:{padding:24,maxWidth:520,margin:"0 auto"}},
      React.createElement("div",{style:{background:"white",borderRadius:12,padding:28,boxShadow:"0 1px 4px rgba(0,0,0,.08)",marginTop:32}},
        React.createElement("div",{style:{fontSize:22,fontWeight:700,marginBottom:6}},"Hoş geldiniz 👋"),
        React.createElement("p",{style:{color:"#64748b",fontSize:14,lineHeight:1.7,marginBottom:24}},
          "27 dersi en çok istediğinizden en az istediğinize doğru sıralayın. ",
          React.createElement("strong",null,"Sürükle-bırak"),
          " (masaüstü) veya ",
          React.createElement("strong",null,"↑↓ tuşları"),
          " (mobil/tablet) ile sıralayabilirsiniz. Bitince ",
          React.createElement("strong",{style:{color:"#16a34a"}},"\"Kopyala & Gönder\""),
          " tuşuna basıp koordinatöre iletin."
        ),
        React.createElement("label",{style:{fontSize:13,fontWeight:600,color:"#374151",display:"block",marginBottom:6}},"Adınız Soyadınız"),
        React.createElement("input",{
          value:name, onChange:e=>setName(e.target.value),
          onKeyDown:e=>e.key==="Enter"&&handleStart(),
          placeholder:"örn. Ahmet Yılmaz",
          style:{width:"100%",border:"1px solid #d1d5db",borderRadius:8,padding:"10px 14px",fontSize:15,outline:"none",marginBottom:14}
        }),
        React.createElement("button",{
          onClick:handleStart, disabled:!name.trim(),
          style:{width:"100%",background:name.trim()?"#1e3a5f":"#94a3b8",color:"white",border:"none",borderRadius:8,padding:"11px 0",fontSize:14,fontWeight:600,cursor:name.trim()?"pointer":"default"}
        },"Sıralamaya Başla →"),
        React.createElement("div",{style:{marginTop:20,padding:"12px 14px",background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,fontSize:12.5,color:"#14532d",lineHeight:1.6}},
          "Sıralama tarayıcınıza otomatik kaydedilir. Sayfayı kapatıp geri döndüğünüzde kaldığınız yerden devam edebilirsiniz."
        )
      )
    )
  );

  /* ─── RANK ───────────────────────────────────────────────── */
  return React.createElement("div",{style:{minHeight:"100vh",background:"#f8f7f4"}},
    /* header */
    React.createElement("div",{style:{background:"#1e3a5f",color:"white",padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 2px 8px rgba(0,0,0,.2)"}},
      React.createElement("div",null,
        React.createElement("div",{style:{fontSize:16,fontWeight:700}},"Ders Tercih Formu"),
        React.createElement("div",{style:{fontSize:11,opacity:.7}},name)
      ),
      React.createElement("button",{onClick:()=>setView("start"),style:{background:"rgba(255,255,255,.15)",border:"none",borderRadius:6,color:"white",padding:"6px 12px",cursor:"pointer",fontSize:12}},"← Çıkış")
    ),
    /* info bar */
    React.createElement("div",{style:{background:"#eff6ff",borderBottom:"1px solid #bfdbfe",padding:"8px 14px",fontSize:12,color:"#1e40af"}},
      React.createElement("strong",null,"Nasıl:"), " Sürükle-bırak veya ↑↓ tuşları ile sıralayın. ",
      React.createElement("span",{style:{color:"#16a34a"}},"● Yeşil"), " = en çok   ",
      React.createElement("span",{style:{color:"#d97706"}},"● Sarı"), " = orta   ",
      React.createElement("span",{style:{color:"#dc2626"}},"● Kırmızı"), " = en az tercih"
    ),
    /* toast */
    toast && React.createElement("div",{style:{position:"fixed",top:70,left:"50%",transform:"translateX(-50%)",background:toastBg[toast.type],color:"white",padding:"10px 20px",borderRadius:24,fontSize:13,fontWeight:600,zIndex:999,boxShadow:"0 4px 12px rgba(0,0,0,.2)",whiteSpace:"nowrap"}},toast.msg),
    /* list */
    React.createElement("div",{style:{padding:"10px 12px 100px",maxWidth:600,margin:"0 auto"}},
      items.map((item,idx)=>{
        const c = tc(idx+1,n);
        const isDragging = dragIdx===idx, isOver = overIdx===idx&&!isDragging;
        return React.createElement("div",{
          key:item.id, draggable:true,
          onDragStart:e=>onDragStart(e,idx), onDragOver:e=>onDragOver(e,idx),
          onDrop:e=>onDrop(e,idx), onDragEnd,
          style:{display:"flex",alignItems:"center",gap:8,
            background:isDragging?"#e0f2fe":isOver?"#f0fdf4":"white",
            border:`1px solid ${isOver?"#86efac":isDragging?"#7dd3fc":"#e2e8f0"}`,
            borderRadius:9,padding:"8px 10px",marginBottom:5,cursor:"grab",
            userSelect:"none",transition:"all .1s",
            boxShadow:isDragging?"0 8px 20px rgba(0,0,0,.12)":"0 1px 2px rgba(0,0,0,.05)",
            opacity:isDragging?.65:1,transform:isOver?"translateY(-1px)":"none"}
        },
          /* grip */
          React.createElement("span",{style:{color:"#cbd5e1",fontSize:16,flexShrink:0,lineHeight:1}},"⠿"),
          /* badge */
          React.createElement("div",{style:{width:30,height:30,borderRadius:"50%",flexShrink:0,background:c.bg,border:`2px solid ${c.ring}`,color:c.text,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12}},idx+1),
          /* name */
          React.createElement("span",{style:{flex:1,fontSize:13,fontWeight:500,color:"#1e293b"}},item.name),
          /* arrows */
          React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:2}},
            ["↑","↓"].map((arrow,d)=>{
              const disabled = d===0?idx===0:idx===n-1;
              return React.createElement("button",{key:d,onClick:()=>move(idx,d===0?-1:1),disabled,
                style:{background:disabled?"#f8fafc":"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:4,width:24,height:22,cursor:disabled?"default":"pointer",fontSize:11,color:disabled?"#e2e8f0":"#64748b",padding:0}
              },arrow);
            })
          )
        );
      })
    ),
    /* bottom bar */
    React.createElement("div",{style:{position:"fixed",bottom:0,left:0,right:0,background:"white",borderTop:"1px solid #e2e8f0",padding:"10px 14px",display:"flex",gap:8,justifyContent:"center",boxShadow:"0 -4px 12px rgba(0,0,0,.06)"}},
      React.createElement("button",{onClick:()=>setItems(COURSES.map((c,i)=>({id:i,name:c}))),
        style:{background:"transparent",border:"1px solid #e2e8f0",borderRadius:7,padding:"8px 12px",cursor:"pointer",fontSize:12,color:"#64748b"}
      },"↺ Sıfırla"),
      React.createElement("button",{onClick:handleSave,
        style:{background:"#475569",color:"white",border:"none",borderRadius:7,padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:600}
      },"💾 Kaydet"),
      APPS_SCRIPT_URL ? React.createElement("button",{onClick:handleSend,
        style:{background:"#1e3a5f",color:"white",border:"none",borderRadius:7,padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:600}
      },"📤 Gönder") : null,
      React.createElement("button",{onClick:handleCopy,
        style:{background:"#16a34a",color:"white",border:"none",borderRadius:7,padding:"8px 18px",cursor:"pointer",fontSize:14,fontWeight:700}
      },"📋 Kopyala & Gönder")
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
