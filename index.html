<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2026-2027 Güz Dönemi Ders Tercihleri</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #f0f2f5; color: #1a2332; overflow: hidden; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }

    .avail-card {
      display: flex; align-items: center; gap: 10px;
      background: white; border: 1.5px solid #e5e7eb;
      border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;
      cursor: pointer; transition: all .15s ease; user-select: none;
    }
    .avail-card:hover {
      border-color: #10b981; background: #f0fdf4;
      transform: translateX(3px); box-shadow: 0 2px 8px rgba(16,185,129,.12);
    }
    .avail-card:active { transform: translateX(5px) scale(.98); }

    .rank-card {
      display: flex; align-items: center; gap: 10px;
      border-radius: 10px; padding: 9px 10px; margin-bottom: 5px;
      animation: slideIn .2s ease; transition: all .15s;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .remove-btn {
      background: none; border: none; cursor: pointer;
      color: #9ca3af; font-size: 15px; line-height: 1;
      padding: 4px 6px; border-radius: 6px;
      transition: all .12s; flex-shrink: 0;
    }
    .remove-btn:hover { background: rgba(239,68,68,.1); color: #ef4444; }

    .add-icon {
      width: 24px; height: 24px; border-radius: 50%;
      background: #d1fae5; color: #059669;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 700; flex-shrink: 0;
      transition: all .15s; line-height: 1;
    }
    .avail-card:hover .add-icon { background: #059669; color: white; }

    .start-input {
      width: 100%; border: 2px solid #e5e7eb; border-radius: 10px;
      padding: 12px 16px; font-size: 15px; font-family: 'DM Sans', sans-serif;
      outline: none; transition: border-color .15s;
      background: white; color: #1a2332;
    }
    .start-input:focus { border-color: #1e3a5f; }

    .start-btn {
      width: 100%; background: #1e3a5f; color: white; border: none;
      border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600;
      font-family: 'DM Sans', sans-serif; cursor: pointer;
      transition: all .15s; letter-spacing: .2px;
    }
    .start-btn:hover:not(:disabled) { background: #152d4a; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30,58,95,.3); }
    .start-btn:disabled { background: #cbd5e1; cursor: default; }

    .send-btn {
      width: 100%; border: none; border-radius: 10px;
      padding: 13px; font-size: 14px; font-weight: 700;
      font-family: 'DM Sans', sans-serif; cursor: pointer;
      transition: all .15s; letter-spacing: .3px;
    }
    .send-btn.ready { background: #059669; color: white; }
    .send-btn.ready:hover { background: #047857; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(5,150,105,.3); }
    .send-btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: default; }

    @media (max-width: 640px) {
      .panels { flex-direction: column !important; }
      .panel  { min-height: 0; flex: 1 !important; }
      .panel-divider { display: none; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ── AYAR ────────────────────────────────────────────────────── */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVPxrjCEQWaMW4DwI7vdk06FjidrsLnWu_5ABH55ctjcwH7GXOtfQEbAJzAPvaab0/exec";  // Apps Script URL buraya

/* ── Ders listesi ────────────────────────────────────────────── */
const COURSES = [
  // ── Lisans ──────────────────────────────────────────────────
  "IKT101 MİKROEKONOMİNİN İLKELERİ",
  "IKT103 GENEL MATEMATİK I",
  "IKT201 MİKROEKONOMİ I",
  "IKT203 MAKROEKONOMİ I",
  "IKT205 MATEMATİKSEL İKTİSAT I",
  "IKT207 İSTATİSTİK",
  "AIS/3-4 SEÇMELİ DERS GRUBU 2. SINIF I",
  "IKT301 PARA VE BANKA TEORİSİ",
  "IKT303 ULUSLARARASI İKTİSAT I",
  "IKT305 EKONOMETRİ I",
  "AIS/5-6 SEÇMELİ DERS GRUBU 3. SINIF I",
  "AIS/5-6 SEÇMELİ DERS GRUBU 3. SINIF II",
  "AIS/5-6 SEÇMELİ DERS GRUBU 3. SINIF III",
  "IKT401 TÜRKİYE EKONOMİSİ",
  "IKT403 İKTİSADİ BÜYÜME VE KALKINMA",
  "IKT405 İKTİSADİ DÜŞÜNCELER TARİHİ",
  "AIS/7-8 SEÇMELİ DERS GRUBU 4. SINIF I",
  "AIS/7-8 SEÇMELİ DERS GRUBU 4. SINIF II",
  "AIS/7-8 SEÇMELİ DERS GRUBU 4. SINIF III",
  // ── Servis ──────────────────────────────────────────────────
  "IKT191 İKTİSADA GİRİŞ (İŞLETME SERVİS)",
  "IKT193 INTRODUCTION TO ECONOMICS (YBS SERVİS)",
  "IKT291 MİKRO İKTİSAT (İŞLETME SERVİS)",
  "M2-IKT195 İKTİSAT I (HUKUK SERVİS)",
  // ── Lisansüstü (YL + Doktora birlikte) ──────────────────────
  "IKTT803 / IKT901 — MİKROEKONOMİ I (YL + Doktora)",
  "IKTT805 / IKT903 — MAKROEKONOMİ I (YL + Doktora)",
  "IKTT807 / IKT905 — EKONOMETRİK MODELLEME (YL + Doktora)",
  "IKT DOKTORA SEÇMELİ",
];
const ALL = COURSES.map((name, id) => ({ id, name }));
const N   = ALL.length;

/* ── localStorage ───────────────────────────────────────────── */
const ls = {
  save : (n, sel) => { try { localStorage.setItem(`rank2:${n}`, JSON.stringify(sel)); } catch {} },
  load : (n)      => { try { const r = localStorage.getItem(`rank2:${n}`); return r ? JSON.parse(r) : null; } catch { return null; } },
};

/* ── Renk ───────────────────────────────────────────────────── */
const color = (rank, total) => {
  const t = rank / total;
  if (t <= 0.33) return { bg:"#d1fae5", border:"#6ee7b7", text:"#065f46", badge:"#059669" };
  if (t <= 0.66) return { bg:"#fef9c3", border:"#fde68a", text:"#92400e", badge:"#d97706" };
  return               { bg:"#fee2e2", border:"#fca5a5", text:"#991b1b", badge:"#dc2626" };
};

/* ═══════════════════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════════════════ */
function App() {
  const [view,      setView]      = useState("start");
  const [name,      setName]      = useState("");
  const [available, setAvailable] = useState(ALL);
  const [selected,  setSelected]  = useState([]);
  const [toast,     setToast]     = useState(null);
  const [sending,   setSending]   = useState(false);

  /* toast */
  const flash = useCallback((type, msg, ms = 2800) => {
    setToast({ type, msg });
    setTimeout(() => setToast(null), ms);
  }, []);

  /* auto-save her seçimde */
  useEffect(() => {
    if (view === "rank" && name) {
      ls.save(name, selected.map(it => it.name));
    }
  }, [selected, view, name]);

  /* başlat */
  const handleStart = () => {
    if (!name.trim()) return;
    const saved = ls.load(name.trim());
    if (saved && saved.length > 0) {
      const selItems  = saved.map(n => ALL.find(it => it.name === n)).filter(Boolean);
      const selIds    = new Set(selItems.map(it => it.id));
      setSelected(selItems);
      setAvailable(ALL.filter(it => !selIds.has(it.id)));
      flash("info", `${selItems.length} tercih yüklendi, kaldığınız yerden devam edin ✓`);
    } else {
      setSelected([]); setAvailable(ALL);
    }
    setView("rank");
  };

  /* seç → sağa taşı */
  const pick = useCallback((item) => {
    setAvailable(prev => prev.filter(it => it.id !== item.id));
    setSelected (prev => [...prev, item]);
  }, []);

  /* kaldır → sola geri */
  const remove = useCallback((item) => {
    setSelected (prev => prev.filter(it => it.id !== item.id));
    setAvailable(prev => [...prev, item].sort((a, b) => a.id - b.id));
  }, []);

  /* gönder */
  const handleSend = async () => {
    if (selected.length < 3) { flash("error", "En az 3 ders seçin."); return; }
    // Kalanları sona ekle (orijinal sırada)
    const full = [...selected, ...available];
    setSelected(full);
    setAvailable([]);
    ls.save(name, full.map(it => it.name));

    if (!APPS_SCRIPT_URL) { flash("info", "Sıralama tamamlandı — Apps Script URL tanımlanmamış."); return; }
    setSending(true);
    const order = full.map(it => it.name);
    const url   = `${APPS_SCRIPT_URL}?name=${encodeURIComponent(name)}&data=${encodeURIComponent(JSON.stringify(order))}`;
    try   { await fetch(url, { mode: "no-cors" }); }
    catch {}
    flash("success", "Google Sheet'e kaydedildi ✓");
    setSending(false);
  };

  /* baştan başla */
  const handleReset = () => {
    if (!window.confirm("Tüm seçimler silinecek. Emin misiniz?")) return;
    setSelected([]);
    setAvailable(ALL);
    ls.save(name, []);
    flash("info", "Sıralama sıfırlandı");
  };

  const pct    = selected.length / N;
  const isDone    = selected.length === N;
  const canSend   = selected.length >= 3;
  const toastBg = { success:"#059669", error:"#dc2626", info:"#1e3a5f" };

  /* ── START ────────────────────────────────────────────────── */
  if (view === "start") return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"center",
                  minHeight:"100vh", background:"#f0f2f5", padding:20 }}>
      <div style={{ background:"white", borderRadius:16, padding:"36px 32px",
                    boxShadow:"0 4px 24px rgba(0,0,0,.1)", maxWidth:440, width:"100%" }}>

        <div style={{ marginBottom:28 }}>
          <div style={{ fontFamily:"'DM Mono', monospace", fontSize:11, fontWeight:500,
                        color:"#059669", letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>
            2026 – 2027 GÜZ DÖNEMİ
          </div>

          <h1 style={{ fontSize:22, fontWeight:700, color:"#1a2332", lineHeight:1.3, marginBottom:18 }}>
            Eğitim ve Öğretim Yılı Güz Dönemi<br/>Ders Tercihleri
          </h1>

          {/* Kullanım kılavuzu */}
          <div style={{ background:"#f8fafc", border:"1px solid #e5e7eb", borderRadius:12,
                        padding:"16px 18px", marginBottom:20 }}>
            <div style={{ fontSize:12, fontWeight:700, color:"#6b7280", textTransform:"uppercase",
                          letterSpacing:.8, marginBottom:12 }}>
              Nasıl Kullanılır?
            </div>
            {[
              ["🖱️", "Sol paneldeki derslere tıklayın", "En çok vermek istediğiniz dersten başlayarak tercih sıranızı oluşturun."],
              ["✅", "En az 3 ders seçin", "3 ders seçtikten sonra Gönder butonu aktif hale gelir."],
              ["🔄", "Seçilmeyen dersler otomatik tamamlanır", "Göndermeden önce soldaki kalan dersler sıralamanın sonuna otomatik eklenir."],
              ["✕",  "Seçimi geri alabilirsiniz", "Sağ paneldeki herhangi bir dersin yanındaki ✕ ikonuna tıklayarak seçimi iptal edip sola geri gönderebilirsiniz."],
              ["↺",  "Baştan başlayabilirsiniz", "Üst bardaki Baştan Başla butonu tüm seçimleri sıfırlar."],
              ["📤", "Gönder butonuna basmayı unutmayın", "Sıralama tamamlandıktan sonra mutlaka Gönder butonuna basın; aksi hâlde verileriniz sisteme ulaşmaz."],
            ].map(([icon, title, desc]) => (
              <div key={title} style={{ display:"flex", gap:10, marginBottom:10, alignItems:"flex-start" }}>
                <div style={{ fontSize:15, width:22, flexShrink:0, textAlign:"center",
                              marginTop:1 }}>{icon}</div>
                <div>
                  <div style={{ fontSize:13, fontWeight:600, color:"#1a2332", marginBottom:2 }}>{title}</div>
                  <div style={{ fontSize:12.5, color:"#6b7280", lineHeight:1.5 }}>{desc}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        <label style={{ display:"block", fontSize:13, fontWeight:600, color:"#374151", marginBottom:6 }}>
          Adınız Soyadınız
        </label>
        <input
          className="start-input"
          value={name}
          onChange={e => setName(e.target.value)}
          onKeyDown={e => e.key === "Enter" && handleStart()}
          placeholder="örn. Ahmet Yılmaz"
          style={{ marginBottom:14 }}
        />
        <button className="start-btn" onClick={handleStart} disabled={!name.trim()}>
          Başla →
        </button>

        <p style={{ textAlign:"center", fontSize:11.5, color:"#9ca3af", marginTop:18, lineHeight:1.5 }}>
          Tarayıcınız tercihinizi kaydeder.<br/>
          Yarıda bırakırsanız kaldığınız yerden devam edebilirsiniz.
        </p>
      </div>
    </div>
  );

  /* ── RANK ─────────────────────────────────────────────────── */
  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100vh", background:"#f0f2f5" }}>

      {/* ── Üst bar ── */}
      <div style={{ background:"#1a2332", color:"white", padding:"0 20px",
                    display:"flex", alignItems:"center", justifyContent:"space-between",
                    height:52, flexShrink:0, boxShadow:"0 2px 10px rgba(0,0,0,.2)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:14 }}>
          <div>
            <div style={{ fontSize:13, fontWeight:700, lineHeight:1.2 }}>2026–2027 Güz Dönemi<br/>Ders Tercihleri</div>
            <div style={{ fontSize:11, opacity:.6, marginTop:-1 }}>{name}</div>
          </div>
          {/* İlerleme */}
          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
            <div style={{ width:120, height:6, background:"rgba(255,255,255,.15)",
                          borderRadius:99, overflow:"hidden" }}>
              <div style={{ height:"100%", width:`${pct*100}%`,
                            background: isDone ? "#10b981" : canSend ? "#f59e0b" : "#60a5fa",
                            borderRadius:99, transition:"width .3s" }}/>
            </div>
            <span style={{ fontSize:12, fontFamily:"'DM Mono',monospace",
                           color: isDone ? "#10b981" : "rgba(255,255,255,.7)" }}>
              {selected.length}/{N}
            </span>
          </div>
        </div>
        <div style={{ display:"flex", gap:6 }}>
          <button onClick={handleReset}
            style={{ background:"rgba(239,68,68,.15)", border:"1px solid rgba(239,68,68,.3)",
                     color:"#fca5a5", borderRadius:7, padding:"5px 12px",
                     cursor:"pointer", fontSize:12, fontWeight:500 }}>
            ↺ Baştan Başla
          </button>
          <button onClick={() => setView("start")}
            style={{ background:"rgba(255,255,255,.1)", border:"none", color:"rgba(255,255,255,.8)",
                     borderRadius:7, padding:"5px 12px", cursor:"pointer", fontSize:12 }}>
            ← Çıkış
          </button>
        </div>
      </div>

      {/* ── Toast ── */}
      {toast && (
        <div style={{ position:"fixed", top:60, left:"50%", transform:"translateX(-50%)",
                      background:toastBg[toast.type], color:"white",
                      padding:"9px 20px", borderRadius:99, fontSize:13, fontWeight:600,
                      zIndex:999, boxShadow:"0 4px 14px rgba(0,0,0,.2)", whiteSpace:"nowrap" }}>
          {toast.msg}
        </div>
      )}

      {/* ── İki panel ── */}
      <div className="panels" style={{ flex:1, display:"flex", overflow:"hidden", gap:0 }}>

        {/* ─ Sol: Seçilebilecekler ─ */}
        <div className="panel" style={{ flex:1, display:"flex", flexDirection:"column",
                                        background:"#f8fafc", overflow:"hidden",
                                        borderRight:"1px solid #e5e7eb" }}>
          <div style={{ padding:"11px 16px", borderBottom:"1px solid #e5e7eb",
                        display:"flex", alignItems:"center", justifyContent:"space-between",
                        flexShrink:0 }}>
            <span style={{ fontSize:12, fontWeight:700, color:"#6b7280",
                           textTransform:"uppercase", letterSpacing:.8 }}>
              Seçilebilecekler
            </span>
            <span style={{ fontFamily:"'DM Mono',monospace", fontSize:12,
                           color:"#059669", fontWeight:600 }}>
              {available.length} ders
            </span>
          </div>

          <div style={{ flex:1, overflowY:"auto", padding:"10px 10px" }}>
            {available.length === 0 ? (
              <div style={{ textAlign:"center", padding:"40px 20px", color:"#9ca3af" }}>
                <div style={{ fontSize:32, marginBottom:8 }}>✓</div>
                <div style={{ fontSize:13 }}>Tüm dersler seçildi</div>
              </div>
            ) : available.map(item => (
              <div key={item.id} className="avail-card" onClick={() => pick(item)}>
                <div className="add-icon">+</div>
                <span style={{ fontSize:13, fontWeight:500, color:"#374151", lineHeight:1.3 }}>
                  {item.name}
                </span>
              </div>
            ))}
          </div>
        </div>

        {/* ─ Sağ: Sıralama ─ */}
        <div className="panel" style={{ flex:1, display:"flex", flexDirection:"column",
                                        background:"white", overflow:"hidden" }}>
          <div style={{ padding:"11px 16px", borderBottom:"1px solid #e5e7eb",
                        display:"flex", alignItems:"center", justifyContent:"space-between",
                        flexShrink:0 }}>
            <span style={{ fontSize:12, fontWeight:700, color:"#6b7280",
                           textTransform:"uppercase", letterSpacing:.8 }}>
              Sıralamanız
            </span>
            <span style={{ fontFamily:"'DM Mono',monospace", fontSize:12,
                           color: isDone ? "#059669" : canSend ? "#d97706" : "#6b7280", fontWeight:600 }}>
              {isDone ? "Tamamlandı ✓" : canSend ? `${selected.length} seçildi — gönderilebilir` : `${selected.length} / ${N}`}
            </span>
          </div>

          <div style={{ flex:1, overflowY:"auto", padding:"10px 10px" }}>
            {selected.length === 0 ? (
              <div style={{ textAlign:"center", padding:"40px 20px", color:"#9ca3af", fontSize:13 }}>
                ← Sol taraftan derslere tıklayın
              </div>
            ) : selected.map((item, idx) => {
              const c = color(idx + 1, N);
              return (
                <div key={item.id} className="rank-card"
                  style={{ background:c.bg, border:`1.5px solid ${c.border}` }}>
                  {/* Sıra numarası */}
                  <div style={{ width:30, height:30, borderRadius:"50%", flexShrink:0,
                                background:c.badge, color:"white",
                                display:"flex", alignItems:"center", justifyContent:"center",
                                fontFamily:"'DM Mono',monospace", fontWeight:500, fontSize:12 }}>
                    {idx + 1}
                  </div>
                  <span style={{ flex:1, fontSize:13, fontWeight:500,
                                 color:"#1a2332", lineHeight:1.3 }}>
                    {item.name}
                  </span>
                  <button className="remove-btn" onClick={() => remove(item)}
                    title="Kaldır (sola geri döner)">
                    ✕
                  </button>
                </div>
              );
            })}
          </div>

          {/* Gönder butonu */}
          <div style={{ padding:"10px 10px", borderTop:"1px solid #e5e7eb", flexShrink:0 }}>
            {canSend ? (
              <button className="send-btn ready" onClick={handleSend} disabled={sending}>
                {sending ? "Gönderiliyor…"
                  : isDone ? "📤 Gönder"
                  : `📤 Gönder  (${N - selected.length} ders otomatik sıralanır)`}
              </button>
            ) : (
              <button className="send-btn" disabled>
                En az 3 ders seçin ({selected.length}/3)
              </button>
            )}
          </div>
        </div>

      </div>{/* /panels */}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
